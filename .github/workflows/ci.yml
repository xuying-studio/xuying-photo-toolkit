name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
        python-version: ['3.12']

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Build macOS native test bridges
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ./scripts/build-macos-vision.sh
          ./scripts/build-macos-visuals.sh

      - name: Run full pytest on macOS
        if: runner.os == 'macOS'
        run: uv run pytest

      - name: Run cross-platform core pytest on Windows
        if: runner.os == 'Windows'
        run: uv run pytest -m "not qml"

      - name: Run offscreen QML smoke
        if: runner.os == 'macOS'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest -q tests/qml -k smoke

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-logs-${{ matrix.os }}
          path: |
            .pytest_cache
            test-results
          if-no-files-found: ignore
