<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">旭影工具箱</title>
  <desc id="desc">面向 macOS 的本地摄影工作流工具，支持文件整理、Adobe XMP 标记同步和关键词快切。</desc>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4EA1FF"/>
      <stop offset="1" stop-color="#8B6CFF"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" rx="30" fill="#0B1220"/>
  <path d="M0 318H1200M690 0V400" stroke="#22304A" stroke-width="1"/>
  <circle cx="1112" cy="-8" r="180" fill="#14203A"/>

  <g transform="translate(62 52)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <text x="0" y="0" dominant-baseline="hanging" font-size="18" font-weight="700" letter-spacing="2" fill="#76B8FF">LOCAL PHOTO WORKFLOW · macOS</text>
    <text x="0" y="58" dominant-baseline="hanging" font-size="54" font-weight="760" fill="#F6F8FC">旭影工具箱</text>
    <text x="0" y="132" dominant-baseline="hanging" font-size="25" font-weight="500" fill="#C6D1E3">把文件整理、XMP 标记与关键词快切</text>
    <text x="0" y="170" dominant-baseline="hanging" font-size="25" font-weight="500" fill="#C6D1E3">收进同一个本地、可预览、可撤回的界面。</text>

    <g transform="translate(0 248)" font-size="18" font-weight="650">
      <rect width="142" height="42" rx="21" fill="#152743" stroke="#315982"/>
      <text x="71" y="27" text-anchor="middle" fill="#D8E9FF">PREVIEW FIRST</text>
      <rect x="154" width="122" height="42" rx="21" fill="#201D40" stroke="#554A88"/>
      <text x="215" y="27" text-anchor="middle" fill="#E4DCFF">UNDO READY</text>
      <rect x="288" width="114" height="42" rx="21" fill="#332718" stroke="#6E5125"/>
      <text x="345" y="27" text-anchor="middle" fill="#FFE3B4">LOCAL ONLY</text>
    </g>
  </g>

  <g transform="translate(730 46)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <rect width="408" height="308" rx="24" fill="#101B2E" stroke="#2C3C58"/>

    <g transform="translate(24 24)">
      <rect width="360" height="72" rx="16" fill="#16243B"/>
      <rect x="14" y="14" width="70" height="44" rx="10" fill="#203A5F"/>
      <text x="49" y="42" text-anchor="middle" font-size="20" font-weight="750" fill="#77B9FF">RAW</text>
      <text x="100" y="33" font-size="20" font-weight="700" fill="#F6F8FC">时间重命名</text>
      <text x="100" y="56" font-size="17" fill="#93A6C2">B_DSC09252.ARW → DSC26-…-00001.ARW</text>
    </g>

    <g transform="translate(24 112)">
      <rect width="360" height="72" rx="16" fill="#16243B"/>
      <rect x="14" y="14" width="70" height="44" rx="10" fill="#2B244D"/>
      <text x="49" y="42" text-anchor="middle" font-size="20" font-weight="750" fill="#AC97FF">PAIR</text>
      <text x="100" y="33" font-size="20" font-weight="700" fill="#F6F8FC">RAW / JPG 配对清理</text>
      <text x="100" y="56" font-size="17" fill="#93A6C2">同目录 · 同主文件名 · 先预览再处理</text>
    </g>

    <g transform="translate(24 200)">
      <rect width="360" height="84" rx="16" fill="#16243B"/>
      <rect x="14" y="20" width="70" height="44" rx="10" fill="#3C2D18"/>
      <text x="49" y="48" text-anchor="middle" font-size="20" font-weight="750" fill="#FFC96B">XMP</text>
      <text x="100" y="32" font-size="20" font-weight="700" fill="#F6F8FC">星标与颜色标签</text>
      <text x="100" y="59" font-size="23" letter-spacing="3" fill="#FFD166">★ ★ ★</text>
      <circle cx="264" cy="52" r="8" fill="#EF5B5B"/>
      <circle cx="290" cy="52" r="8" fill="#F5C451"/>
      <circle cx="316" cy="52" r="8" fill="#4EA1FF"/>
    </g>
  </g>

  <rect x="62" y="374" width="1076" height="3" rx="1.5" fill="url(#brand)"/>
</svg>
